name = "flixora-proxy"
main = "src/index.js"
compatibility_date = "2025-10-01"
workers_dev = true

# Edge caching only works on a custom domain (not *.workers.dev).
# Uncomment and set your own hostname (domain must be on Cloudflare):
routes = [{ pattern = "stream.toxybox99.eu.org", custom_domain = true }]

[vars]
# REQUIRED - host(s) of your Flixora backend (same host as API_BASE_URL), comma separated.
ALLOWED_ORIGINS = "api.toxybox99.eu.org"

# Chunk size cached at the edge, in MB (1-32). 4 is a good balance for Free plan memory.
CHUNK_MB = "4"
# Open-ended Range requests ("bytes=N-") are answered with at most this many chunks;
# the player automatically asks for the next part. Keeps every request under the 50-subrequest limit.
MAX_CHUNKS = "12"
# How long a chunk stays in the edge cache (seconds). Default 7 days.
CACHE_TTL = "604800"
# "auto" = on for custom domains, off for *.workers.dev. Use "true"/"false" to force.
ENABLE_CACHE = "auto"
# If your player does NOT re-request after a shorter 206, set to "false".
CAP_OPEN_RANGES = "true"
# Start looking up / fetching the next chunk while the current one streams.
PREFETCH_NEXT = "true"
# Backend has TURNSTILE_SECRET set? Then keep "true" and add the same value as a Worker secret.
# Backend has Turnstile OFF? Set "false" so downloads are cached too.
BACKEND_USES_TURNSTILE = "true"
# Countries that may not use the proxy (ISO codes, comma separated). The UI login is never blocked.
# BLOCK_COUNTRIES = "CN,RU"
# Day boundary for the daily stats, minutes after UTC (330 = Sri Lanka).
STATS_TZ_MIN = "330"
# Telegram alerts (secrets TG_BOT_TOKEN + TG_CHAT_ID): this many failed streams in 10 min -> alert.
ALERT_ERRORS = "5"
# Alert when today's edge cache hit rate drops below this percent (0 = off).
ALERT_MIN_HIT_PCT = "0"
# One client (hash of the IP) pulling more than this many GB within an hour -> Telegram alert (0 = off).
ABUSE_GB_PER_HOUR = "30"
# Per client limits, answered with 429 (0 = no limit). Many mobile users can share one IP (CGNAT), so keep these generous.
MAX_CLIENT_REQS = "24"
MAX_CLIENT_FILES = "6"
# Cloudflare Free plan usage meter (UI -> Limits): Worker requests per day (Free = 100000, resets 00:00 UTC)
# and the Telegram alert level: alert at this % of any daily Free limit, again at 95% (0 = off).
CF_REQ_LIMIT = "100000"
CF_WARN_PCT = "80"
# Almost every setting in this block can also be edited in the UI (Config page). Edited values are saved in the
# LOGS Durable Object and win over this file; "reset" in the UI goes back to the values written here.
# Optional short mode: lets https://worker/dl/<id>/<name> map to this backend URL.
# ORIGIN_URL = "https://api.example.com"

# Activity log (Live log panel). Free plan: Durable Objects must be SQLite-backed.
# Remove these two blocks if you do not want the persistent log (memory mode is used then).
[[durable_objects.bindings]]
name = "LOGS"
class_name = "LogHub"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["LogHub"]

# Health check + Telegram alerts every 5 minutes (needs the LOGS Durable Object above).
[triggers]
crons = ["*/5 * * * *"]
